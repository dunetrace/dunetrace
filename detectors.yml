# DuneTrace — Detector Thresholds
#
# Edit this file to tune detector sensitivity for your agents.
# Restart the detector AND alerts worker after any change:
#
#   docker compose restart detector alerts
#
# All fields are optional. Omitted fields use the SDK default (shown below).
# Per-agent-category overrides are supported — see the commented examples.
#
# ── Alert policies ────────────────────────────────────────────────────────────
# Each detector can declare an alert_policy that controls how many runs must
# trigger before an alert fires. Three modes:
#
#   immediate   — alert on first occurrence (default when no policy is set)
#   consecutive — alert after N consecutive runs all trigger this detector
#   frequency   — alert when N of the last M runs trigger this detector
#
# One-off failures are silently counted. Only sustained patterns alert.

default:

  tool_loop:
    threshold: 3      # fire if same tool called >= N times in window
    window: 5         # number of recent tool calls to inspect
    alert_policy:
      mode: consecutive   # alert after 2 runs in a row — one-off flukes don't alert
      threshold: 2
      window_runs: 10

  tool_thrashing:
    window: 6         # alternating A/B pattern checked over last N tool calls
    alert_policy:
      mode: consecutive
      threshold: 2
      window_runs: 10

  tool_avoidance:
    min_llm_calls: 2  # ignore runs with fewer LLM calls (too short to judge)
    alert_policy:
      mode: frequency
      threshold: 3
      window_runs: 10

  goal_abandonment:
    stall_steps: 4    # consecutive LLM-only events (no tool calls) to trigger
    alert_policy:
      mode: consecutive
      threshold: 2
      window_runs: 10

  rag_empty_retrieval:
    min_score: 0.3    # top relevance score below this is treated as empty
    min_results: 1    # result count below this is treated as empty
    alert_policy:
      mode: frequency
      threshold: 3
      window_runs: 10

  llm_truncation_loop:
    threshold: 2      # number of finish_reason=length events to trigger
    alert_policy:
      mode: consecutive
      threshold: 2
      window_runs: 10

  context_bloat:
    growth_factor: 3.0    # last/first prompt token ratio to trigger (static fallback when no baseline)
    min_calls: 3          # minimum LLM calls with token data required
    min_last_tokens: 2000 # suppress signal if final token count is below this
    inflation_factor: 2.0 # fire when growth > P75_baseline × this (requires ≥10 historical runs)
    alert_policy:
      mode: frequency     # trending issue — alert when it's becoming a pattern
      threshold: 3
      window_runs: 10

  retry_storm:
    threshold: 3      # consecutive failures on the same tool to trigger
    alert_policy:
      mode: consecutive
      threshold: 2
      window_runs: 10

  slow_step:
    inflation_factor: 2.0 # fire when step duration > P75_baseline × this (requires ≥10 historical runs)
    alert_policy:
      mode: frequency
      threshold: 3
      window_runs: 10

  step_count_inflation:
    inflation_factor: 2.0 # multiplier over P75 baseline to trigger
    alert_policy:
      mode: frequency
      threshold: 3
      window_runs: 10

  cascading_tool_failure:
    threshold: 3      # consecutive cross-tool failures to trigger
    alert_policy:
      mode: consecutive
      threshold: 2
      window_runs: 10

  first_step_failure:
    max_step: 2       # step index at or below which an error triggers
    alert_policy:
      mode: immediate   # always serious — config or setup issue, alert immediately
      threshold: 1
      window_runs: 1

  reasoning_stall:
    ratio_threshold: 4.0  # LLM calls / tool calls ratio to trigger (static fallback when no baseline)
    min_llm_calls: 5      # ignore short runs with fewer LLM calls
    inflation_factor: 2.0 # fire when ratio > P75_baseline × this (requires ≥10 historical runs)
    alert_policy:
      mode: frequency
      threshold: 3
      window_runs: 10

  cost_spike:
    inflation_factor: 3.0        # fire when total tokens > P75_baseline × this (requires ≥10 historical runs)
    static_threshold_tokens: 50000  # fallback threshold when no baseline exists
    min_llm_calls: 1             # ignore runs with no LLM calls
    alert_policy:
      mode: immediate   # any cost spike is worth knowing about immediately
      threshold: 1
      window_runs: 1

  session_latency:
    inflation_factor: 3.0        # fire when duration > P75_baseline × this (requires ≥10 historical runs)
    static_threshold_secs: 300   # fallback threshold when no baseline exists (5 min)
    min_events: 2                # need at least two events to compute a duration
    alert_policy:
      mode: frequency
      threshold: 3
      window_runs: 10

  prompt_injection_signal:
    alert_policy:
      mode: immediate   # security signal — always alert on first occurrence
      threshold: 1
      window_runs: 1

  empty_llm_response:
    alert_policy:
      mode: consecutive
      threshold: 2
      window_runs: 10


# ── Per-agent-category overrides ─────────────────────────────────────────────
#
# Add a section named after your agent category to override specific thresholds.
# Any detector not listed here falls back to the "default" values above.
#
# Example: web-research agents legitimately call search multiple times,
# so a higher tool_loop threshold reduces false positives.
#
# web-research:
#   tool_loop:
#     threshold: 5
#   context_bloat:
#     growth_factor: 4.0
#
# Example: coding agents accumulate large tool outputs (file reads, test output).
#
# coding:
#   context_bloat:
#     growth_factor: 5.0
#     min_last_tokens: 4000
#   step_count_inflation:
#     inflation_factor: 1.5
