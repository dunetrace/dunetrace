[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunetrace-mcp"
version = "0.4.7"
description = "Dunetrace MCP server - expose agent signals to Claude Code, Cursor, and Codex"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{ name = "Dunetrace UG (haftungsbeschränkt)", email = "vikas@dunetrace.com" }]
keywords = ["ai", "agents", "mcp", "observability", "llm", "monitoring"]
dependencies = [
    # server.py imports `mcp.server.fastmcp`, which bounds this at BOTH ends:
    #   < 1.2  — the module does not exist yet (1.0.0 ships no fastmcp at all,
    #            so the previous `>=1.0` floor was never actually satisfiable)
    #   >= 2.0 — the module was renamed to `mcp.server.mcpserver`
    # An unbounded `>=1.0` meant CI silently installed 2.0.0 on release day and
    # every test collection died on ModuleNotFoundError, while local checkouts
    # pinned at 1.23.x kept passing. Moving to 2.x is an API migration, not a
    # version bump — do it deliberately, then raise this ceiling.
    #
    # The floor is 1.9.4, not 1.2, because of the --sse bind address:
    # FastMCP's Settings.host defaulted to "0.0.0.0" through 1.9.0 and only
    # became "127.0.0.1" in 1.9.4. This server has no authentication in any
    # version, so a `>=1.2` range meant the *same command* exposed every tool
    # (and the operator's admin bearer token) on every interface or on
    # loopback depending on which `mcp` the resolver happened to pick.
    # main() also sets mcp.settings.host explicitly; this floor is what makes
    # the default safe for anything that bypasses main().
    "mcp>=1.9.4,<2",
    "httpx>=0.24",
]

[project.scripts]
dunetrace-mcp = "dunetrace_mcp.server:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["dunetrace_mcp*"]

# The dunetrace://docs/* resources serve Markdown from <repo-root>/docs/, which is
# outside this package. setup.py's build hook copies it into dunetrace_mcp/_docs/
# at build time; this is what puts it in the wheel. Without it the resources
# resolve into site-packages and return "(doc not found)" on a real install.
[tool.setuptools.package-data]
# Second glob: some served docs live in a docs/ subdirectory (integrations/…),
# and setup.py mirrors that structure rather than flattening it, so one
# repo-relative path works for both the wheel and a source checkout.
dunetrace_mcp = ["_docs/*.md", "_docs/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
