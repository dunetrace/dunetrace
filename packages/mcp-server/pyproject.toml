[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunetrace-mcp"
version = "0.4.3"
description = "Dunetrace MCP server - expose agent signals to Claude Code, Cursor, and Codex"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{ name = "Dunetrace", email = "dunetrace@gmail.com" }]
keywords = ["ai", "agents", "mcp", "observability", "llm", "monitoring"]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.24",
]

[project.scripts]
dunetrace-mcp = "dunetrace_mcp.server:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["dunetrace_mcp*"]

# The dunetrace://docs/* resources serve Markdown from <repo-root>/docs/, which is
# outside this package. setup.py's build hook copies it into dunetrace_mcp/_docs/
# at build time; this is what puts it in the wheel. Without it the resources
# resolve into site-packages and return "(doc not found)" on a real install.
[tool.setuptools.package-data]
dunetrace_mcp = ["_docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
