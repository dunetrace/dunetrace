[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunetrace"
version = "0.5.2"
description = "Real-time monitoring for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{ name = "Dunetrace", email = "dunetrace@gmail.com" }]
keywords = ["ai", "agents", "observability", "llm", "monitoring"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

# Zero required dependencies — the core SDK uses only the stdlib.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain>=1.0", "langgraph>=0.2"]
haystack = ["haystack-ai>=2.0"]
openai-agents = ["openai-agents>=0.1,<1.0"]
otel = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    # Kills (and dumps the stack of) any single hung test so a deadlock can't
    # wedge a local `pre-commit run` — the same protection CI uses.
    "pytest-timeout",
    "mypy",
    "ruff",
    # Test-only (not a runtime dependency — the core SDK stays stdlib-only). The
    # policy evaluator's ReDoS timeout uses `regex` when present and degrades to
    # stdlib `re` (no timeout) otherwise; the test env installs it so the
    # timeout-protected path is actually exercised instead of hanging on the
    # catastrophic-backtracking test pattern.
    "regex",
]

[project.urls]
Homepage    = "https://github.com/dunetrace/dunetrace"
Repository  = "https://github.com/dunetrace/dunetrace"
Issues      = "https://github.com/dunetrace/dunetrace/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["dunetrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict         = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dunetrace.integrations.*", "dunetrace.auto"]
ignore_errors = true
