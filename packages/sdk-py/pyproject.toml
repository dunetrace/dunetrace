[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunetrace"
version = "0.5.0"
description = "Real-time monitoring for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{ name = "Dunetrace", email = "dunetrace@gmail.com" }]
keywords = ["ai", "agents", "observability", "llm", "monitoring"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

# Zero required dependencies — the core SDK uses only the stdlib.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain>=1.0", "langgraph>=0.2"]
haystack = ["haystack-ai>=2.0"]
openai-agents = ["openai-agents>=0.1,<1.0"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.urls]
Homepage    = "https://github.com/dunetrace/dunetrace"
Repository  = "https://github.com/dunetrace/dunetrace"
Issues      = "https://github.com/dunetrace/dunetrace/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["dunetrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict         = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dunetrace.integrations.*", "dunetrace.auto"]
ignore_errors = true
