# DuneTrace — Postgres + Ingest + Detector + Alerts + Customer API
# Usage: docker compose up -d
# Customer API: http://localhost:8002  (docs at /docs)
# Ingest API:   http://localhost:8001  (dev only — in production, traffic goes via auth service)
#
# Auth service lives in the private dunetrace-cloud repo.
# To run the full production stack locally:
#   docker compose -f docker-compose.yml \
#     -f ../dunetrace-cloud/infrastructure/docker-compose.auth.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dunetrace
      POSTGRES_PASSWORD: dunetrace
      POSTGRES_DB: dunetrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dunetrace -d dunetrace"]
      interval: 3s
      timeout: 5s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "ingest_svc.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql://dunetrace:dunetrace@postgres:5432/dunetrace
      ENV: dev
      AUTH_MODE: dev
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      PYTHONPATH: /app/services/ingest
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  detector:
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    restart: unless-stopped
    volumes:
      - ./detectors.yml:/app/detectors.yml:ro
    environment:
      DATABASE_URL: postgresql://dunetrace:dunetrace@postgres:5432/dunetrace
      POLL_INTERVAL: 5
      STALL_TIMEOUT_SECS: 60
      PYTHONPATH: /app/packages/sdk-py:/app/services/detector
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_started
    command: ["python", "-m", "detector_svc.worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import asyncpg\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alerts:
    build:
      context: .
      dockerfile: services/alerts/Dockerfile
    restart: unless-stopped
    volumes:
      - ./detectors.yml:/app/detectors.yml:ro
    environment:
      DATABASE_URL: postgresql://dunetrace:dunetrace@postgres:5432/dunetrace
      POLL_INTERVAL: 10
      PYTHONPATH: /app/packages/sdk-py:/app/services/explainer:/app/services/alerts
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      SLACK_MIN_SEVERITY: ${SLACK_MIN_SEVERITY:-LOW}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      detector:
        condition: service_started
    command: ["python", "-m", "alerts_svc.worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import asyncpg\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8002:8002"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dunetrace:dunetrace@postgres:5432/dunetrace
      AUTH_MODE: dev
      PYTHONPATH: /app/packages/sdk-py:/app/services/explainer:/app/services/api
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "api_svc.main:app", "--host", "0.0.0.0", "--port", "8002"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    restart: unless-stopped
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
