# Serves dashboard/mission-control.html (docker-compose.yml mounts this file
# read-only as /etc/nginx/conf.d/default.conf in the nginx:alpine container).
#
# Security headers
# ----------------
# Every response carries the four headers below (`always` = on error pages too).
# The Content-Security-Policy is the one that matters: its script-src is ONLY
# the SHA-256 hash of the page's single inline <script>, so an injected script
# tag or inline handler has no matching hash and the browser refuses to run it.
#
#   * The hash is over the exact bytes between the opening <script> tag's '>'
#     and '</script>'. ANY edit to the script changes it, and a stale hash means
#     the browser runs nothing (blank page, one console error). Regenerate with
#         python scripts/check_dashboard_safety.py --fix
#     CI runs the same script without --fix and fails a PR whose hash is stale.
#
#   * connect-src must list the origin the page's `const API` (top of the
#     <script> in mission-control.html) points at. The quickstart's
#     http://localhost:8002 is listed; if you point API at a reverse-proxied
#     path on the dashboard's own origin ('self', the recommended production
#     shape — see docs/operations.md, "Reverse proxy and the dashboard's API
#     origin") nothing else is needed, and if you point it at a different
#     origin add that origin here too.
#
#   * style-src carries 'unsafe-inline' on purpose: the page has one <style>
#     block, ~660 inline style="" attributes and sets element.style from JS.
#     Hashing every attribute is not practical, and 'unsafe-inline' on styles
#     does not weaken the script-src protection above — an attacker who can
#     inject markup already controls layout; what they cannot do is run code.
#     A future move to classes would let this become a single style hash.
#
#   * fonts.googleapis.com / fonts.gstatic.com are the IBM Plex stylesheet and
#     the font files it references (the <link> in the page's <head>).
#
#   * img-src 'self' data: — the page draws its own SVG; data: is a harmless
#     allowance for any future inline icon. There are no external images.
#
#   * frame-ancestors 'none' (plus X-Frame-Options DENY for old browsers) — the
#     dashboard is never embedded. Nothing needs frames, plugins, or a <base>
#     tag, and the CSV export uses an <a download> click, which CSP does not
#     govern, so no blob: entry is needed.

server {
    listen 80;

    root /usr/share/nginx/html;
    index mission-control.html index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'sha256-yspupuPU/1vx6hPL4hTLTP4AxCs5v4pnijagtKToYjk='; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8002; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /mission-control.html;
    }
}
