# Reverse proxy in front of the stack — the production topology docs/operations.md
# ("Deploying") describes. The ingest and customer APIs stay bound to loopback in
# docker-compose*.yml; this is the one process that publishes them, on ONE origin
# with the dashboard, so the browser never makes a cross-origin API call (the
# customer API only allows CORS from app.dunetrace.io in prod mode).
#
# Point the dashboard's `const API` at "<this origin>/api" and give the SDK
# endpoint="<this origin>". TLS termination is up to you (put certs on this
# server block or terminate in front of it). Do NOT proxy /metrics or /ready —
# they are unauthenticated and belong on the internal network only.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream ingest {
        server ingest:8001;
    }

    upstream api {
        server api:8002;
    }

    server {
        listen 80;
        server_name _;

        # Everything the SDK talks to on the ingest service: event batches,
        # deploy markers, the policy and detector-config fetches, OTLP traces.
        location ~ ^/v1/(ingest|deploy|policies|detector-config|otlp/traces)$ {
            proxy_pass         http://ingest;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
            # Body cap is enforced by ingest (INGEST_MAX_BODY_BYTES, default 10 MiB);
            # keep nginx's own limit at or above it so ingest, not nginx, answers.
            client_max_body_size 12m;
        }

        # Customer API under /api/ — the trailing slash on proxy_pass strips the
        # prefix, so /api/v1/signals reaches the service as /v1/signals.
        location /api/ {
            proxy_pass         http://api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Same security headers dashboard/nginx.conf ships for the quickstart
        # container. The script-src hash is checked by
        # scripts/check_dashboard_safety.py (see docs/operations.md, "Dashboard
        # security headers"); if this file serves the page, keep the token here
        # identical to the one in dashboard/nginx.conf. connect-src is 'self'
        # only, because on this topology the API is same-origin under /api/.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'sha256-yspupuPU/1vx6hPL4hTLTP4AxCs5v4pnijagtKToYjk='; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        location / {
            root   /usr/share/nginx/html;
            index  mission-control.html index.html;
        }
    }
}
