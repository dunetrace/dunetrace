repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff          # lint — auto-fixes what it can
        args: [--fix]
      - id: ruff-format   # format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args:
          - --severity-level=medium   # skip LOW findings
          - --confidence-level=medium # skip low-confidence findings
          - --skip=B310,B608
          # B310: urllib.request.urlopen — intentional in SDK client and alert webhook sender
          # B608: SQL injection (low-confidence) — asyncpg uses $1/$2 parameterised queries;
          #        bandit cannot see through f-string construction of WHERE clauses
        files: ^(services|packages/sdk-py)/

  - repo: local
    hooks:
      - id: ts-typecheck
        name: TypeScript typecheck
        language: system
        entry: bash -c 'cd packages/sdk-ts && npm run typecheck'
        pass_filenames: false
        files: ^packages/sdk-ts/.*\.(ts|json)$

      - id: mcp-mypy
        name: MCP server mypy
        language: system
        entry: python -m mypy packages/mcp-server/dunetrace_mcp/ --ignore-missing-imports --no-error-summary
        pass_filenames: false
        files: ^packages/mcp-server/.*\.py$
